<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="description"
        content="Portfolio of Heni Lachouak, AI &amp; Data Engineer: LLM systems, data pipelines, computer vision.">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
    <title>Heni Lachouak — AI & Data Engineer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #36d736;
            --sf: #fff;
            --tx: #18231F;
            --mu: #5C6B65;
            --ln: #DCE3DE;
            --ac: #0B6E4F;
            --ac2: #E1F1EA;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0F1A16;
                --sf: #16251F;
                --tx: #E6EFEA;
                --mu: #93A89F;
                --ln: #27403A;
                --ac: #4FCB9C;
                --ac2: #173A2E
            }
        }

        :root[data-theme="dark"] {
            --bg: #0F1A16;
            --sf: #16251F;
            --tx: #E6EFEA;
            --mu: #93A89F;
            --ln: #27403A;
            --ac: #4FCB9C;
            --ac2: #173A2E
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 16px/1.65 'DM Sans', system-ui, sans-serif;
            display: grid;
            grid-template-columns: 290px 1fr;
            min-height: 100vh
        }

        h1,
        h2,
        h3 {
            font-family: Fraunces, Georgia, serif;
            margin: 0;
            line-height: 1.15
        }

        a {
            color: var(--ac)
        }

        aside {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            height: 100vh;
            overflow: auto;
            border-right: 1px solid var(--ln);
            padding: 24px 18px;
            background: var(--sf)
        }

        aside .nm {
            font: 800 20px Fraunces, serif;
            display: block;
            color: var(--tx);
            text-decoration: none
        }

        aside small {
            color: var(--mu)
        }

        .tree {
            margin: 22px 0;
            padding: 0;
            list-style: none
        }

        .tree ul {
            list-style: none;
            margin: 2px 0 8px 12px;
            padding-left: 12px;
            border-left: 1px solid var(--ln)
        }

        .tree a {
            display: block;
            padding: 5px 8px;
            border-radius: 8px;
            color: var(--tx);
            text-decoration: none;
            font-size: 15px
        }

        .tree ul a {
            color: var(--mu);
            font-size: 14px
        }

        .tree a:hover,
        .tree a.on {
            background: var(--ac2);
            color: var(--ac)
        }

        .tree .g {
            font-weight: 700;
            margin-top: 6px
        }

        .ctl {
            display: flex;
            gap: 8px
        }

        button {
            font: inherit;
            cursor: pointer;
            border: 1px solid var(--ln);
            background: var(--bg);
            color: var(--tx);
            border-radius: 8px;
            padding: 6px 12px
        }

        a:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--ac);
            outline-offset: 2px
        }

        #mb {
            display: none
        }

        main {
            padding: 40px 48px 64px;
            max-width: 900px;
            width: 100%
        }

        .bc {
            font-size: 14px;
            color: var(--mu);
            margin-bottom: 22px
        }

        .bc a {
            color: var(--mu)
        }

        h1 {
            font-size: clamp(34px, 5vw, 52px);
            font-weight: 800;
            letter-spacing: -.02em;
            margin-bottom: 12px
        }

        h2 {
            font-size: 26px;
            margin: 36px 0 12px
        }

        .lead {
            font-size: 18px;
            color: var(--mu);
            max-width: 62ch
        }

        .ph {
            width: 150px;
            aspect-ratio: 1;
            border-radius: 16px;
            background: var(--ac2);
            border: 2px dashed var(--ac);
            display: grid;
            place-items: center;
            text-align: center;
            color: var(--ac);
            font-size: 13px;
            font-weight: 700;
            padding: 10px;
            margin-bottom: 20px
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-top: 24px
        }

        .c {
            display: block;
            background: var(--sf);
            border: 1px solid var(--ln);
            border-radius: 14px;
            padding: 18px;
            text-decoration: none;
            color: var(--tx)
        }

        .c:hover {
            border-color: var(--ac)
        }

        .c h3 {
            font-size: 20px;
            margin-bottom: 6px
        }

        .c p {
            margin: 0;
            color: var(--mu);
            font-size: 14px
        }

        .row {
            display: block;
            background: var(--sf);
            border: 1px solid var(--ln);
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 10px;
            text-decoration: none;
            color: var(--tx)
        }

        .row:hover {
            border-color: var(--ac)
        }

        .row b {
            font: 700 18px Fraunces, serif
        }

        .row span {
            display: block;
            color: var(--mu);
            font-size: 14px
        }

        ul.p {
            padding-left: 20px
        }

        ul.p li {
            margin-bottom: 6px
        }

        .tg {
            color: var(--ac);
            font-weight: 700;
            font-size: 14px
        }

        .demo {
            border: 1px dashed var(--ln);
            border-radius: 12px;
            padding: 22px;
            color: var(--mu);
            text-align: center;
            margin: 16px 0
        }

        .shots {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 16px 0
        }

        .shots img {
            width: 100%;
            border-radius: 10px;
            border: 1px solid var(--ln);
            cursor: zoom-in
        }

        .btn {
            display: inline-block;
            background: var(--ac);
            color: var(--bg);
            padding: 9px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            margin: 0 8px 8px 0
        }

        .tl {
            border-left: 2px solid var(--ln);
            padding-left: 20px
        }

        .tl>div {
            margin-bottom: 22px
        }

        .tl small {
            color: var(--mu)
        }

        .ct {
            margin-top: 56px;
            padding-top: 8px;
            border-top: 1px solid var(--ln)
        }

        .cl {
            display: flex;
            flex-wrap: wrap;
            gap: 10px
        }

        .cl a,
        .cl .soon {
            background: var(--sf);
            border: 1px solid var(--ln);
            border-radius: 10px;
            padding: 9px 16px;
            text-decoration: none;
            font-weight: 500;
            color: var(--tx)
        }

        .cl a:hover {
            border-color: var(--ac);
            color: var(--ac)
        }

        .cl .soon {
            color: var(--mu);
            border-style: dashed
        }

        #lb {
            position: fixed;
            inset: 0;
            background: #000d;
            display: none;
            place-items: center;
            z-index: 9;
            padding: 20px
        }

        #lb.on {
            display: grid
        }

        #lb img {
            max-width: 100%;
            max-height: 100%
        }

        @media(max-width:820px) {
            body {
                display: block
            }

            aside {
                position: static;
                height: auto;
                border: 0;
                border-bottom: 1px solid var(--ln)
            }

            .tree,
            .ctl {
                display: none
            }

            aside.open .tree {
                display: block
            }

            aside.open .ctl {
                display: flex
            }

            #mb {
                display: inline-block;
                margin-top: 10px
            }

            main {
                padding: 24px 18px
            }

            .cards,
            .shots {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <aside><a class="nm" href="#/">Heni Lachouak</a><small id="sub"></small>
        <div><button id="mb">☰ Menu</button></div>

    </aside>

    <script>
        let L = 0; const $ = s => document.querySelector(s), T = x => Array.isArray(x) ? x[L] : x;
        const S = { ev: ["Events", "Événements"], evd: ["Conferences, meetups and hackathons I attended or hosted.", "Conférences, rencontres et hackathons auxquels j'ai participé ou que j'ai animés."], cert: ["Certificate coming soon", "Certificat à venir"], post: ["View LinkedIn post", "Voir le post LinkedIn"], ph: ["Photos & certificates", "Photos et certificats"], home: ["Home", "Accueil"], exp: ["Experience", "Expérience"], res: ["Research & awards", "Recherche et distinctions"], con: ["Contact", "Contact"], prof: ["Profiles", "Profils"], demo: ["Demo video coming soon", "Vidéo démo à venir"], shots: ["Screenshots", "Captures d'écran"], proj: ["Projects", "Projets"], skills: ["Core skills", "Compétences clés"], back: ["Back to", "Retour à"], pub: ["Publications", "Publications"], aw: ["Awards", "Distinctions"], ed: ["Education & certifications", "Formation et certifications"] };
        const R = {
            ai: { n: "AI Engineer", d: ["LLM systems, RAG, fine-tuning and computer vision, from prototype to production.", "Systèmes LLM, RAG, fine-tuning et vision par ordinateur, du prototype à la production."], k: "LLMs, RAG/KAG, LangChain, LangGraph, LangSmith, MCP, multi-agent systems, QLoRA (Unsloth), Ollama, vLLM, PyTorch, TensorFlow, Hugging Face, YOLOv8" },
            data: { n: "Data Engineer", d: ["OCR-to-structured ETL, ingestion layers, dataset curation and data quality.", "ETL depuis l'OCR, couches d'ingestion, curation de datasets et qualité des données."], k: "SQL, Python (Pandas), ETL/ELT, Spark/PySpark, Delta Lake, dbt, Databricks, AWS S3/Lambda, MongoDB, FAISS, Pinecone, n8n" },
            sw: { n: "Software Engineer", d: ["APIs, microservices and applications that put models in users' hands.", "API, microservices et applications qui mettent les modèles entre les mains des utilisateurs."], k: "Python, JavaScript, C/C++, FastAPI, Flask, React, Docker, Git, CI/CD, Twilio" }
        };
        const P = [
            { id: "legal", r: ["ai", "data", "sw"], n: "Legal Data Extraction", tg: "LegalTech · ETL · QLoRA", s: ["OCR-to-structured pipeline that digitises real estate deeds into a queryable MongoDB model.", "Pipeline OCR vers données structurées qui numérise des actes immobiliers dans un modèle MongoDB interrogeable."], p: [["Rebuilds each property's full ownership history by linking parties, legal acts and dates across documents (1980s to today).", "Reconstitue l'historique de propriété de chaque bien en reliant parties, actes et dates (des années 1980 à aujourd'hui)."], ["Expert-in-the-loop validation controls quality and builds a curated fine-tuning dataset.", "Validation par des experts pour contrôler la qualité et constituer un dataset de fine-tuning."], ["Qwen fine-tuned with QLoRA (chunked vs. full-document) and served in a React + MongoDB app: ~75% less manual review per document.", "Qwen affiné en QLoRA (par chunks vs document complet), servi dans une app React + MongoDB : ~75% de revue manuelle en moins."]], t: "Gemini OCR, Gemini 2.5 Flash, Qwen, QLoRA, Unsloth, PyTorch, Ollama, vLLM, LangChain, React, MongoDB, n8n", l: [["Legalcy", "https://www.legalcy-avocats.fr/"]], i: [] },
            { id: "callbot", r: ["ai", "sw"], n: "AI Voice Call-Bot", tg: "Multi-agent · RAG/KAG · Twilio", s: ["Production multi-agent voice bot that qualifies inbound calls, routes them and books appointments.", "Bot vocal multi-agents en production qui qualifie les appels entrants, les route et prend les rendez-vous."], p: [["Serves hospitality, event and agency clients; ~60% less call processing time.", "Pour l'hôtellerie, l'événementiel et les agences ; ~60% de temps de traitement en moins."], ["RAG/KAG retrieval layer serving real-time knowledge to agents, on microservices integrated with Twilio and orchestrated in n8n.", "Couche de retrieval RAG/KAG fournissant la connaissance en temps réel aux agents, en microservices intégrés à Twilio et orchestrés dans n8n."]], t: "Twilio, Gemini, LangChain, LangGraph, LangSmith, RAG/KAG, n8n", l: [["Live site", "https://callbot.playpro.fr/"]], i: [["assets/callbot-dashboard.webp", "Alyas dashboard — AI team", "Dashboard Alyas — équipe IA"], ["assets/callbot-workflow.webp", "Outbound call workflow (n8n)", "Workflow d'appels sortants (n8n)"]] },
            { id: "content", r: ["data", "ai"], n: "Content & Outreach Automation", tg: "n8n · LLM agents · RAG", s: ["n8n pipelines that turn keywords and source content into published posts, articles and outreach.", "Pipelines n8n qui transforment mots-clés et contenus sources en publications, articles et prospection."], p: [["Daily Facebook and LinkedIn publishing through LLM agents: ~90% less manual scheduling.", "Publication quotidienne sur Facebook et LinkedIn via des agents LLM : ~90% de planification manuelle en moins."], ["Document ingestion and indexing layer (chunking, embeddings, vector store) behind the RAG systems.", "Couche d'ingestion et d'indexation (chunking, embeddings, vector store) derrière les systèmes RAG."], ["SEO article generator (~70% faster production) and outbound email prospecting (3x outreach volume).", "Générateur d'articles SEO (~70% de production en plus rapide) et prospection email sortante (volume x3)."], ["Persona-driven prompts versioned and traced in LangChain and LangSmith.", "Prompts par persona versionnés et tracés dans LangChain et LangSmith."]], t: "n8n, LangChain, LangSmith, RAG, OpenAI, Mistral, Google AI", l: [], i: [["assets/content-generation.webp", "Content generation", "Génération de contenu"], ["assets/rss-collection.webp", "RSS news collection", "Collecte d'actualités RSS"], ["assets/linkedin-writing.webp", "LinkedIn writing automation", "Rédaction LinkedIn automatisée"], ["assets/page-prompts.webp", "Page prompt generation", "Génération de prompts par page"], ["assets/linkedin-outreach.webp", "LinkedIn outreach sequence", "Séquence de prospection LinkedIn"]] },
            { id: "report", r: ["data", "ai"], n: "Production Report Extraction", tg: "Autoliv · ETL · Local LLMs", s: ["ETL that turns production reports into structured records, ending manual data entry.", "ETL qui transforme des rapports de production en enregistrements structurés, sans saisie manuelle."], p: [["Extracts tables, charts and text with OCR and loads structured records into Excel.", "Extrait tableaux, graphiques et texte par OCR et charge des enregistrements structurés dans Excel."], ["A validation agent routes, checks and structures each record, feeding a real-time production timeline dashboard.", "Un agent de validation route, vérifie et structure chaque enregistrement, pour un tableau de bord de production en temps réel."], ["Local LLMs orchestrated with Ollama and LangChain, exposed through FastAPI.", "LLM locaux orchestrés avec Ollama et LangChain, exposés via FastAPI."]], t: "Ollama, LangChain, FastAPI, OCR, Python, Excel", l: [], i: [] },
            { id: "defect", r: ["ai", "data"], n: "Visual Defect Detection", tg: "Computer vision · Edge AI", s: ["Edge-deployed vision model for production defect segmentation.", "Modèle de vision embarqué pour la segmentation de défauts en production."], p: [["Image pipeline: UV-photography capture, Roboflow annotation, AWS S3 storage.", "Pipeline d'images : capture en photographie UV, annotation Roboflow, stockage AWS S3."], ["YOLOv8 at 97% precision, deployed on NVIDIA Jetson Xavier with under 50 ms inference.", "YOLOv8 à 97% de précision, déployé sur NVIDIA Jetson Xavier avec moins de 50 ms d'inférence."], ["Real-time monitoring dashboard for supervisors.", "Tableau de bord de suivi qualité en temps réel pour les superviseurs."]], t: "YOLOv8, Roboflow, AWS S3, NVIDIA Jetson Xavier, Python", l: [], i: [] },
            { id: "matcher", r: ["ai", "sw"], n: "CV Job Matcher", tg: "NLP · Semantic search", s: ["Personal project that ranks candidates or offers by semantic similarity.", "Projet personnel qui classe candidats ou offres par similarité sémantique."], p: [["An LLM parses resumes and job descriptions into structured profiles (skills, experience, education).", "Un LLM analyse CV et offres en profils structurés (compétences, expérience, formation)."], ["Embedding-based ranking with explainable match scores and skill-gap analysis.", "Classement par embeddings avec scores explicables et analyse des compétences manquantes."], ["Served via FastAPI with a lightweight recruiter interface.", "Servi via FastAPI avec une interface recruteur légère."]], t: "Python, LLMs, embeddings, FastAPI", l: [], i: [] }];
        const EV = [
            { id: "nuit", n: ["Nuit de l'Info", "Nuit de l'Info"], d: ["Every year · first Thursday of December", "Chaque année · 1er jeudi de décembre"], s: ["The one-night national hackathon I take part in every year, with a podium finish three years in a row.", "Le hackathon national d'une nuit auquel je participe chaque année, avec un podium trois années de suite."], p: [["2025: 3rd place, SFEIR challenge (AI Augmented Form).", "2025 : 3e place, défi SFEIR (AI Augmented Form)."], ["2024: 3rd place, SFEIR challenge.", "2024 : 3e place, défi SFEIR."], ["2023: 2nd place, veep.ai challenge (Vis ma Vie).", "2023 : 2e place, défi veep.ai (Vis ma Vie)."]], l: [], i: [] },
            { id: "dijon", n: ["Event in Dijon, France", "Événement à Dijon, France"], d: ["March 2025", "Mars 2025"], s: ["Took part in and hosted activities on the CESI stand in Dijon, in front of students and families.", "Participation et animation sur le stand du CESI à Dijon, face à des élèves et des familles."], l: ["https://lnkd.in/p/d7CsaEE6"], i: [["assets/dijon-stand.webp", "At the CESI stand", "Sur le stand du CESI"], ["assets/dijon-demo.webp", "Hosting a demo", "Animation d'une démonstration"]] },
            { id: "aiccsa", n: ["AICCSA 2024 conference", "Conférence AICCSA 2024"], d: ["22–26 October 2024 · Sousse, Tunisia", "22–26 octobre 2024 · Sousse, Tunisie"], s: ["Presented “Hybrid CNN-Swin Transformer for Glaucoma Screening in Fundus Images” at the 21st ACS/IEEE International Conference on Computer Systems and Applications.", "Présentation de « Hybrid CNN-Swin Transformer for Glaucoma Screening in Fundus Images » à la 21e conférence internationale ACS/IEEE sur les systèmes et applications informatiques."], l: [], c: 1, i: [["assets/aiccsa-certificate.webp", "Certificate of Contribution", "Certificat de contribution"]] },
            { id: "ftusa", n: ["17th FTUSA meeting", "17e rendez-vous FTUSA"], d: ["2024", "2024"], s: ["Took part in the 17th FTUSA meeting in 2024.", "Participation au 17e rendez-vous FTUSA en 2024."], l: ["https://lnkd.in/p/dRKQZfUa"], i: [] },
            { id: "splinter", n: ["Splinter AI club launch", "Lancement du club Splinter AI"], d: ["February 2024 · EPI Digital School", "Février 2024 · EPI Digital School"], s: ["Launch of the Splinter AI club at EPI Digital School, where I served as Vice President.", "Lancement du club Splinter AI à l'EPI Digital School, dont j'étais vice-président."], l: ["https://lnkd.in/p/dzN9wd9e"], i: [["assets/splinter-ai.webp", "Splinter AI team announcement", "Annonce de l'équipe Splinter AI"]] }];
        const E = [{ n: "AI & Automation Engineer — Nehos Groupe", d: ["France · Aug 2025 – Present", "France · août 2025 – aujourd'hui"], p: ["legal", "callbot", "content"] }, { n: "AI Engineer, Industry 4.0 — Autoliv", d: ["Tunisia (freelance) · Jan 2024 – Dec 2024", "Tunisie (freelance) · janv. 2024 – déc. 2024"], p: ["report", "defect"] }];
        const pl = (id, r) => { const p = P.find(x => x.id === id); return `<a class="row" href="#/${r}/${id}"><b>${p.n}</b><span>${T(p.s)}</span><span class="tg">${p.tg}</span></a>` };

            return o + [['exp', 'experience'], ['res', 'research'], ['ev', 'events'], ['con', 'contact']].map(([k, u]) => `<li><a href="#/${u}" class="${h === '#/' + u ? 'on' : ''}">${T(S[k])}</a></li>`).join('')
        }
        function render() {
            const h = location.hash || '#/', a = h.split('/').slice(1), m = $('#m'); let o = ''; const bc = (...x) => `<div class="bc"><a href="#/">${T(S.home)}</a>${x.map(y => ' / ' + y).join('')}</div>`;
            $('#sub').textContent = L ? "Ingénieur IA & Data" : "AI & Data Engineer";
            if (!a[0]) { o = `<div class="ph">Your photo here<br>(replace me)</div><h1>Heni Lachouak</h1><p class="lead">${L ? "Ingénieur IA & Data avec plus de 2 ans d'expérience sur des systèmes LLM en production et les pipelines de données qui les alimentent." : "AI & Data Engineer with 2+ years building production LLM systems and the data pipelines that feed them."}</p><div class="cards">${Object.keys(R).map(r => `<a class="c" href="#/${r}"><h3>${R[r].n}</h3><p>${T(R[r].d)}</p><p class="tg">${P.filter(p => p.r.includes(r)).length} ${T(S.proj).toLowerCase()}</p></a>`).join('')}</div>` }

            else if (R[a[0]]) { const r = a[0], p = P.find(x => x.id === a[1]); if (p) o = bc(`<a href="#/${r}">${R[r].n}</a>`, p.n) + `<h1>${p.n}</h1><p class="tg">${p.tg}</p><p class="lead">${T(p.s)}</p><ul class="p">${p.p.map(x => `<li>${T(x)}</li>`).join('')}</ul><p><b>Stack:</b> ${p.t}</p>${p.l.map(l => `<a class="btn" href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗</a>`).join('')}<div class="demo">${T(S.demo)}</div>${p.i.length ? `<h2>${T(S.shots)}</h2><div class="shots">${p.i.map(i => `<figure style="margin:0"><img src="${i[0]}" alt="${T(i.slice(1))}"><figcaption class="bc">${i[L + 1]}</figcaption></figure>`).join('')}</div>` : ''}<p><a href="#/${r}">← ${T(S.back)} ${R[r].n}</a></p>` }
